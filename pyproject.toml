[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsync-mcp"
version = "0.3.0"
description = "MindSync MCP server — local-first multi-agent memory sync and focus conflict detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MindSync contributors" }]
dependencies = [
    "mcp>=1.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mindsync = "mindsync.server:main"

[tool.setuptools.packages.find]
include = ["mindsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
