[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindsync-ai"
dynamic = ["version"]
description = "Local-first MCP orchestration, shared memory, and automatic task routing for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aditya Arya" }, { name = "MindSync Contributors" }]
keywords = [
    "mcp",
    "memory",
    "sync",
    "multi-agent",
    "agents",
    "llm",
    "event-bus",
    "dispatch",
    "mindsync-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.27.0,<2",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/adityarya24/mindsync-ai"
Documentation = "https://github.com/adityarya24/mindsync-ai#readme"
Issues = "https://github.com/adityarya24/mindsync-ai/issues"
Changelog = "https://github.com/adityarya24/mindsync-ai/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build", "twine", "ruff>=0.4,<0.16"]

[project.scripts]
mindsync = "mindsync.server:main"
mindsync-dispatch = "mindsync.dispatch.cli:main"

[tool.setuptools.packages.find]
include = ["mindsync*"]

[tool.setuptools.package-data]
mindsync = ["dispatch/presets/*.json"]

[tool.setuptools.dynamic]
version = {attr = "mindsync.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
