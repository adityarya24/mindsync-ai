name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  gate:
    name: Verify CI succeeded for tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          package_version=$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("mindsync/__init__.py").read_text(encoding="utf-8")); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)))')
          expected_tag="v${package_version}"
          if [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}. Expected ${expected_tag}."
            exit 1
          fi

      - name: Verify tagged commit belongs to master
        run: |
          sha="${GITHUB_SHA}"
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::Tagged commit $sha is not reachable from origin/master. Refusing to release."
            exit 1
          fi

      - name: Check CI workflow conclusion for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Checking successful push CI (ci.yml) for master commit $sha"
          successful_runs=$(gh api "repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${sha}&branch=master&event=push&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${sha}\" and .event == \"push\" and .head_branch == \"master\" and .conclusion == \"success\")] | length")
          echo "Successful master push CI runs: $successful_runs"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::Successful push CI on master is missing for commit $sha. Refusing to release."
            exit 1
          fi

  build:
    name: Build Distribution
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check artifacts
        run: twine check dist/*

      - name: Verify only wheel + sdist would be published
        run: |
          cd dist
          extras=$(ls -1 | grep -vE '\.(whl|tar\.gz)$' || true)
          if [ -n "$extras" ]; then
            echo "::error::Unexpected files in dist/ that would be published to PyPI: $extras"
            exit 1
          fi
          ls -la

      - name: Generate checksums (kept out of the PyPI-bound dist/ artifact)
        run: |
          mkdir -p checksums
          sha256sum dist/* > checksums/checksums.txt
          cat checksums/checksums.txt

      - name: Upload distributions artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/

      - name: Upload checksums artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: checksums
          path: checksums/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Download checksums artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: checksums
          path: checksums

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
            checksums/checksums.txt
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mindsync-ai
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Verify only wheel + sdist will be published
        run: |
          cd dist
          extras=$(ls -1 | grep -vE '\.(whl|tar\.gz)$' || true)
          if [ -n "$extras" ]; then
            echo "::error::Refusing to publish: non-distribution files present in dist/: $extras"
            exit 1
          fi
          ls -la

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist
