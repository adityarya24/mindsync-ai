name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # PRs: one slot per PR ref, and a new run cancels the previous one — so a run
  # that hangs (a stuck runner leaves it 'in_progress' forever) is cleared by the
  # next push instead of blocking every later PR run in the same group.
  # Pushes to master: one slot per commit SHA, never cancelled, so each commit
  # keeps its own CI conclusion for the release workflow's gate to read.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lock:
    name: Dependency lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"

      - name: Verify dependency lockfile
        run: uv lock --check

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip cache purge
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q

      - name: Ruff check
        run: ruff check .

      - name: Local smoke test
        run: python scripts/smoke_test.py
